services:
  dev:
    container_name: dune-${SANDBOX_NAME:-runner}
    hostname: dune-${SANDBOX_NAME:-runner}
    image: dune-python:${PYTHON_VERSION:-3.10}
    build:
      context: .
      dockerfile: ${SANDBOX_DOCKERFILE:-Dockerfile.mentat}
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.10}
    user: "0:0"
    working_dir: /workspace/${PROJECT_NAME:?PROJECT_NAME not set}
    volumes:
      - ${TARGET_PROJECT}:/workspace/${PROJECT_NAME}:rw

      # Persistent caches and Neovim states (stored in dune/data/)
      - ../../data/nvim/share:/root/.local/share/nvim:rw
      - ../../data/nvim/state:/root/.local/state/nvim:rw
      - ../../data/pip-cache:/root/.cache/pip:rw


      # agent configurations
      - ./config/pi:/root/.pi:rw
      - ./config/gemini/:/root/.gemini:rw
      - ./config/claude/:/root/.claude:rw
      - ./config/claude.json:/root/.claude.json:rw


    environment:
      - HOME=/root
      - TERM=xterm-256color
      # Optional GitLab PAT (will be skipped or empty if not provided)
      - GIT_CONFIG_COUNT=${GITLAB_READ_TOKEN:+1}
      - GIT_CONFIG_KEY_0=url.https://oauth2:${GITLAB_READ_TOKEN:-}@gitlab.tu-ilmenau.de/.insteadOf
      - GIT_CONFIG_VALUE_0=https://gitlab.tu-ilmenau.de/
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - FOWNER
    stdin_open: true
    tty: true
    env_file:
      # 1. Base AI sandbox defaults / API keys in sandboxes/ai/.env
      - path: .env
        required: false
      # 2. Project-level .env overrides
      - path: ${PROJECT_ENV_FILE:-/dev/null}
        required: false