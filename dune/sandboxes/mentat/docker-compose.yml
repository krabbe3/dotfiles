services:
  dev:
    container_name: dune-${SANDBOX_NAME:-runner}
    hostname: dune-${SANDBOX_NAME:-runner}
    image: dune-python:${PYTHON_VERSION:-3.10}
    build:
      context: .
      dockerfile: ${SANDBOX_DOCKERFILE:-Dockerfile.mentat}
      # shallow clone of the local dotfiles repo, set by bin/dune-mentat;
      # the fallback does not exist, so builds outside dune-mentat fail
      additional_contexts:
        dotfiles: ${DOTFILES_CONTEXT:-./.no-dotfiles-context}
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.10}
    user: "0:0"
    # project mount (same path as on the host) and working dir are added by
    # bin/dune-mentat: live mode = real repo rw + .git ro, isolated = clone
    volumes:
      # Persistent caches and Neovim states (stored in dune/data/)
      - ../../data/nvim/share:/root/.local/share/nvim:rw
      - ../../data/nvim/state:/root/.local/state/nvim:rw
      - ../../data/pip-cache:/root/.cache/pip:rw

      # container start script (Python env setup, then zsh)
      - ./entrypoint.sh:/opt/dune/entrypoint.sh:ro
      # builds Linux copies of macOS host envs (bin/dune-mentat, step 7b)
      - ./mirror:/opt/dune/mirror:ro


      # agent configurations
      - ./config/pi:/root/.pi:rw
      - ./config/gemini/:/root/.gemini:rw
      - ./config/claude/:/root/.claude:rw
      - ./config/claude.json:/root/.claude.json:rw


    environment:
      - HOME=/root
      - TERM=xterm-256color
      # GitLab token: only passed with 'dune mentat --gitlab' (see bin/dune-mentat)
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - FOWNER
    stdin_open: true
    tty: true
    env_file:
      # 1. Base AI sandbox defaults / API keys in sandboxes/mentat/.env
      - path: .env
        required: false
      # 2. Project-level .env overrides
      - path: ${PROJECT_ENV_FILE:-/dev/null}
        required: false