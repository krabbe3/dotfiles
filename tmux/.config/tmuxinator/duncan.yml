# ~/.config/tmuxinator/duncan.yml
name: <%= @args[0] || "dev" %>
root: <%= @settings["root"] || "." %>

# used by 'dune ghola -t duncan'; plain 'dune ghola' builds the same layout without tmuxinator
pre_window:
  - conda activate <%= @args[1] || "base" %>
  - clear

attach: true

windows:
  - editor:
      layout: f8dc,301x68,0,0{113x68,0,0,1,115x68,114,0,4,71x68,230,0,5}
      panes:
        - dune mentat
        - nvim .
        - ""

  - git:
      layout: even-horizontal
      panes:
        - lazygit
        - ""   # dune diff / undo / snap -l

  - explorer:
      panes:
        - ""
