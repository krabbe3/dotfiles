# ~/.config/tmuxinator/duncan.yml
name: <%= @args[0] || "dev" %>
root: <%= @settings["root"] || "." %>

pre_window:
  - cd "<%= @settings["root"] || "." %>"
  - eval "$(conda shell.posix hook 2>/dev/null)"
  - conda activate <%= @args[1] || "base" %>
  - clear

attach: true

windows:
  - editor:
      layout: f8dc,301x68,0,0{113x68,0,0,1,115x68,114,0,4,71x68,230,0,5}
      panes:
        - dune mentat
        - nvim
        - ""

  - git:
      panes:
        - lazygit

  - explorer:
      panes:
        - ""
